# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Increased display time of messages
set-option -g display-time 4000

# Switch panes
bind n select-pane -L
bind e select-pane -D
bind i select-pane -U
bind o select-pane -R

# Simplify moving panes around
bind N command-prompt -p "place left of. select target window" "move-pane -h -b -t %%"
bind E command-prompt -p "place below. select target window" "move-pane -v -b -t %%"
bind I command-prompt -p "place right of. select target window" "move-pane -v -t %%"
bind O command-prompt -p "place right of. select target window" "move-pane -h -t %%"

# Start window numbers at 1
set -g base-index 1
setw -g pane-base-index 1

# Custom status bar, right half
set -g status-right ' #[fg=default,bg=grey]%H:%M |#[fg=white] %a #[fg=white] | %Y-%m-%d  '

# Key (re-) bindings
# Open new panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded."

# Allow mouse scrolling
set -g mouse on


# Visual stuff

# Status bar
set-option -g status-position bottom
set-option -g status-style fg=default,bg=grey

set-window-option -g window-status-style fg=default,bg=grey
set-window-option -g window-status-current-style fg=default,bold,bg=grey

set-option -g pane-border-style fg=grey
set-option -g pane-active-border-style fg=brightwhite


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
# End of config file
